services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Optional: A simple application service to connect to the databases
  # app:
  #   build: .
  #   container_name: app_container
  #   depends_on:
  #     - mongodb
  #     - redis
  #   environment:
  #     MONGO_URI: mongodb://docker_user:docker_password@mongodb:27017/mydb
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #   networks:
  #     - app-network

volumes:
  mongo_data:
  redis_data:

networks:
  app-network:
    driver: bridge
